<body>
  <main class="app">
    <header class="topbar">
      <div class="logo" aria-hidden="true">✦</div>
      <div class="brand">
        <h1>Nova AI</h1>
        <div class="status">
          <span class="dot"></span>
          Demo assistant · Ready
        </div>
      </div>
      <button class="clear-btn" id="clear-btn" type="button">
        Clear chat
      </button>
    </header>

    <section class="messages" id="messages" aria-live="polite">
      <div class="welcome" id="welcome">
        <div class="welcome-icon">✧</div>
        <h2>What can I help you with?</h2>
        <p>Ask a question, explore an idea, or choose a suggestion below to start a conversation.</p>
        <div class="suggestions">
          <button class="suggestion" type="button" data-prompt="Give me three tips for learning programming.">💻 Learn programming</button>
          <button class="suggestion" type="button" data-prompt="Help me plan a productive day.">📅 Plan my day</button>
          <button class="suggestion" type="button" data-prompt="Tell me an interesting science fact.">🔭 Science fact</button>
        </div>
      </div>
    </section>

    <footer class="composer-wrap">
      <form class="composer" id="chat-form">
        <input
          id="user-input"
          type="text"
          placeholder="Message Nova AI..."
          autocomplete="off"
          aria-label="Type your message"
          maxlength="2000"
          required
        >
        <button id="send-btn" type="submit" aria-label="Send message">➤</button>
      </form>
      <p class="hint">Demo version · Replies are generated locally, not by an AI model.</p>
    </footer>
  </main>

  <script>
    "use strict";

    (() => {
      const form = document.getElementById("chat-form");
      const input = document.getElementById("user-input");
      const messages = document.getElementById("messages");
      const clearButton = document.getElementById("clear-btn");
      const sendButton = document.getElementById("send-btn");
      const welcome = document.getElementById("welcome");

      if (!form || !input || !messages || !clearButton || !sendButton) {
        document.body.textContent =
          "The chat interface could not initialize. Please reload the page.";
        return;
      }

      function getTime() {
        return new Intl.DateTimeFormat([], {
          hour: "2-digit",
          minute: "2-digit"
        }).format(new Date());
      }

      function addMessage(text, sender) {
        const row = document.createElement("article");
        row.className = "message " + sender;

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;

        const time = document.createElement("time");
        time.className = "time";
        time.dateTime = new Date().toISOString();
        time.textContent = getTime();

        row.append(bubble, time);
        messages.appendChild(row);
        messages.scrollTop = messages.scrollHeight;
      }

      function getReply(text) {
        const message = text.toLowerCase();

        if (/\b(hi|hello|hey|good morning|good evening)\b/.test(message)) {
          return "Hey! 👋 Welcome to Nova AI. I'm currently running in demo mode. Ask me about programming, studying, or general topics!";
        }

        if (message.includes("your name") || message.includes("who are you")) {
          return "I'm Nova AI, a chatbot demo built with HTML, CSS, and JavaScript. A real AI model can be connected through a secure backend in a future version.";
        }

        if (message.includes("program") || message.includes("coding") || message.includes("javascript")) {
          return "Here's a good way to learn programming:\n\n1. Choose one language and learn its fundamentals.\n2. Practise variables, conditions, loops, and functions.\n3. Build small projects instead of only watching tutorials.\n4. Learn to debug errors and use GitHub to track your work.\n\nConsistency matters more than studying for long hours at once.";
        }

        if (message.includes("study") || message.includes("productive") || message.includes("plan my day")) {
          return "Try this simple plan:\n\n1. Pick your three most important tasks.\n2. Work for 25 minutes, then take a 5-minute break.\n3. Put distracting notifications away.\n4. Review what you completed at the end of the day.\n\nStart with one small task now.";
        }

        if (message.includes("science") || message.includes("fact")) {
          return "Here's a fun science fact: a day on Venus is longer than its year. Venus takes about 243 Earth days to rotate once, but about 225 Earth days to orbit the Sun.";
        }

        if (message.includes("thank")) {
          return "You're welcome! 😊 Feel free to ask me something else.";
        }

        if (message.includes("help")) {
          return "I can demonstrate a few sample responses about programming, studying, and science. This version uses simple built-in rules rather than a real AI model.";
        }

        return "Thanks for your message! 😊 I received it successfully. This demo doesn't have a real AI model connected yet, so I can't generate an intelligent answer to every question. The next upgrade is connecting a secure AI backend.";
      }

      function sendMessage(text) {
        const cleanText = text.trim();
        if (!cleanText) return;

        if (welcome && welcome.isConnected) {
          welcome.remove();
        }

        addMessage(cleanText, "user");
        input.value = "";
        sendButton.disabled = true;

        // A brief delay makes the demo feel conversational.
        window.setTimeout(() => {
          addMessage(getReply(cleanText), "bot");
          sendButton.disabled = false;
          input.focus();
        }, 250);
      }

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        sendMessage(input.value);
      });

      messages.addEventListener("click", (event) => {
        const button = event.target.closest("[data-prompt]");
        if (button) {
          sendMessage(button.dataset.prompt);
        }
      });

      clearButton.addEventListener("click", () => {
        messages.replaceChildren();
        if (welcome) {
          messages.appendChild(welcome);
        }
        input.value = "";
        input.focus();
      });

      input.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          input.value = "";
        }
      });

      input.focus();
    })();
  </script>
</body>
</html>
